name: Testes automáticos

on:
  push:
    branches: [main, supabase-integration]
  pull_request:
  workflow_dispatch:   # botão "Run workflow" na aba Actions

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (o mesmo que a Vercel faz)
        run: npm run build
      - name: Rodar testes (explorador + fluxos)
        run: npm test
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: |
            test-results/RELATORIO.md
            playwright-report/
          retention-days: 14
